name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: spatialtag-linux-x86_64
          - runner: macos-latest
            name: spatialtag-macos-arm64
          - runner: windows-latest
            name: spatialtag-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build CLI binary
        shell: bash
        run: |
          python -m pip install -e ".[build]"
          pyinstaller --clean --noconfirm spatial/spatial.spec
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/spatialtag.exe "${{ matrix.name }}"
          else
            cp dist/spatialtag "${{ matrix.name }}"
            chmod +x "${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  audio-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pack HRIR assets
        run: |
          cd audio
          zip -r ../audio.zip hrirs decoder corrections vendor
      - uses: actions/upload-artifact@v7
        with:
          name: audio-zip
          path: audio.zip

  release:
    needs: [build-cli, audio-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
