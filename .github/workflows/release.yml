name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: spatialtag-linux-x86_64
          - runner: macos-latest
            name: spatialtag-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build CLI binary
        run: |
          python -m pip install -e ".[build]"
          pyinstaller --clean --noconfirm spatial/spatial.spec
          cp dist/spatialtag ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  audio-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack HRIR assets
        run: |
          cd audio
          zip -r ../audio.zip hrirs decoder corrections vendor
      - uses: actions/upload-artifact@v4
        with:
          name: audio-zip
          path: audio.zip

  release:
    needs: [build-cli, audio-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
