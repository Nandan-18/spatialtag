# Deploy static site + optional CLI binaries to GitHub Pages.
#
# Checks you will see on each deploy:
#   - build-linux / build-macos / deploy  → jobs in this workflow
#   - pages build and deployment / *      → GitHub's Pages deployment UI
#     (paired with actions/deploy-pages; not duplicate workflows)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "spatialmedia/**"
      - "docker/README.md"
      - "audio/README.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'spatialmedia/**'
              - 'pyproject.toml'
              - 'spatialmedia/spatialmedia_cli.spec'

  build-linux:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux CLI binary
        run: |
          python -m pip install -e ".[build]"
          pyinstaller --clean --noconfirm spatialmedia/spatialmedia_cli.spec
          cp dist/spatialmedia spatialmedia-linux-x86_64
          chmod +x spatialmedia-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux
          path: spatialmedia-linux-x86_64

  build-macos:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS CLI binary
        run: |
          python -m pip install -e ".[build]"
          pyinstaller --clean --noconfirm spatialmedia/spatialmedia_cli.spec
          cp dist/spatialmedia spatialmedia-macos-arm64
          chmod +x spatialmedia-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: cli-macos
          path: spatialmedia-macos-arm64

  deploy:
    needs: [changes, build-linux, build-macos]
    if: |
      always() &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached CLI binaries
        uses: actions/cache/restore@v4
        with:
          path: cached-binaries
          key: cli-binaries-${{ hashFiles('spatialmedia/**/*.py', 'pyproject.toml', 'spatialmedia/spatialmedia_cli.spec') }}
          restore-keys: |
            cli-binaries-

      - name: Download fresh CLI artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Stage binaries for site build
        run: |
          mkdir -p staged-binaries
          for path in \
            artifacts/cli-linux/spatialmedia-linux-x86_64 \
            artifacts/cli-macos/spatialmedia-macos-arm64 \
            cached-binaries/spatialmedia-linux-x86_64 \
            cached-binaries/spatialmedia-macos-arm64
          do
            if [ -f "$path" ]; then
              cp "$path" "staged-binaries/$(basename "$path")"
            fi
          done
          ls -la staged-binaries || true

      - name: Write download manifest
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          entries = [
              ("staged-binaries/spatialmedia-linux-x86_64", "spatialmedia-linux-x86_64", "Linux (x86_64)", "Ubuntu / most Linux distros", "Single-file executable. chmod +x then run from a terminal."),
              ("staged-binaries/spatialmedia-macos-arm64", "spatialmedia-macos-arm64", "macOS (Apple Silicon)", "arm64 (M1/M2/M3+)", "May need: xattr -dr com.apple.quarantine ./spatialmedia-macos-arm64"),
          ]
          downloads = []
          for source, filename, label, arch, note in entries:
              if Path(source).is_file():
                  downloads.append({
                      "source": source,
                      "filename": filename,
                      "label": label,
                      "arch": arch,
                      "note": note,
                  })
          Path("web/manifest.json").write_text(json.dumps({"downloads": downloads}, indent=2) + "\n")
          print(f"Manifest: {len(downloads)} binary(ies)")
          PY

      - name: Generate test fixtures and run browser inject smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=1 -f lavfi -i anoisesrc=channel_layout=4.0:sample_rate=48000 \
            -t 0.05 -c:v libx264 -c:a aac -shortest tests/fixtures/testsrc_320x240_h264_4ch.mp4
          node web/test-inject.mjs

      - name: Build static site
        run: |
          python -m pip install markdown pygments
          python web/build.py --output web/dist --manifest web/manifest.json

      - name: Save CLI binaries cache
        if: needs.changes.outputs.cli == 'true'
        run: |
          mkdir -p cached-binaries
          cp staged-binaries/* cached-binaries/ 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: needs.changes.outputs.cli == 'true'
        with:
          path: cached-binaries
          key: cli-binaries-${{ hashFiles('spatialmedia/**/*.py', 'pyproject.toml', 'spatialmedia/spatialmedia_cli.spec') }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
