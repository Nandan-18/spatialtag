name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Generate test fixture and run browser inject smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=1 -f lavfi -i anullsrc=r=48000:cl=4.0 \
            -t 0.05 -c:v libx264 -c:a aac -shortest tests/fixtures/h264-4ch.mp4
          node web/test-inject.mjs

      - name: Build static site
        run: |
          python -m pip install "markdown>=3.10.2" "pygments>=2.20"
          python web/build.py --output web/dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
