name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check spatialmedia spatialmedia_test.py docker
      - name: Ruff format
        run: python -m ruff format --check spatialmedia spatialmedia_test.py docker
      - name: Unit tests
        run: python spatialmedia_test.py -v
      - name: Mypy (mpeg package)
        run: python -m mypy spatialmedia/mpeg
        continue-on-error: true
