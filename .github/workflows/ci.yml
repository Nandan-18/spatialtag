name: CI

on:
  push:
    branches: [main]
    paths:
      - "spatial/**"
      - "tests/**"
      - "docker/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check spatial tests/test.py docker
      - name: Ruff format
        run: python -m ruff format --check spatial tests/test.py docker
      - name: Unit tests
        run: python tests/test.py -v
      - name: Mypy (mpeg package)
        run: python -m mypy spatial/mpeg
        continue-on-error: true
