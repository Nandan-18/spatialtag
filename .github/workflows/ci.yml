name: CI

on:
  push:
    branches: [main]
    paths:
      - "spatial/**"
      - "tests/**"
      - "docker/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check spatial tests/test.py docker
      - name: Ruff format
        run: python -m ruff format --check spatial tests/test.py docker
      - name: Generate spatial-audio fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i anullsrc=r=48000:cl=4.0 \
            -t 0.2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest tests/fixtures/h264-4ch.mp4
      - name: Unit tests
        run: python tests/test.py -v
      - name: Mypy (mpeg package)
        run: python -m mypy spatial/mpeg
        continue-on-error: true
