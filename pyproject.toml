[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialtag"
version = "1.0.0"
description = "SpatialTag: inspect and inject immersive MP4/MOV metadata."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["pillow>=12.3", "packaging>=26.2"]
build = ["pyinstaller>=6.21", "pillow>=12.3", "packaging>=26.2"]
dev = [
    "ruff>=0.15.22",
    "mypy>=2.3",
    "markdown>=3.10.2",
    "pygments>=2.20",
]

[project.scripts]
spatialtag = "spatial.__main__:main_entry"

[tool.setuptools.packages.find]
include = ["spatial*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["spatial", "docker"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"spatial/__main__.py" = ["E402"]
"spatial/gui.py" = ["E402", "I001"]
"docker/app.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["spatial.mpeg"]
ignore_missing_imports = true
warn_unused_ignores = true
