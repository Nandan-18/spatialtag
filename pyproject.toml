[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-media"
version = "1.0.0"
description = "Specifications and tools for 360 video and spatial audio."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["pillow", "packaging"]
build = ["pyinstaller", "pillow", "packaging"]
dev = ["ruff>=0.6", "mypy>=1.8", "markdown>=3.5", "pygments>=2.17"]

[project.scripts]
spatial-media = "spatial.__main__:main_entry"

[tool.setuptools.packages.find]
include = ["spatial*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["spatial", "docker"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"spatial/__main__.py" = ["E402"]
"spatial/gui.py" = ["E402", "I001"]
"docker/app.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
packages = ["spatial.mpeg"]
ignore_missing_imports = true
warn_unused_ignores = true
